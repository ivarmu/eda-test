---
- name: Listen for webhook events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Critical alert detected
      condition: event.payload.status == "critical"
      action:
        run_job_template:
          name: "Demo Job Template"
          organization: "Default"
          job_args:
            extra_vars:
              alert_message: "{{ event.payload.message }}"
...
